# paper/config/label_maps/tabula_muris_b_gt_map.yaml
version: 1
dataset_id: tabula_muris_b
input_key: meta.cluster

matching:
  mode: substring_ci
  first_match_wins: true

labels:
  - Mature_B
  - Erythrocyte_like
  - Mast_like
  - pDC_Myeloid_like
  - B_Other

rules:
  # Specific source labels must precede the broad B-cell rule.
  - label: Erythrocyte_like
    include_any:
      - "immature b cell"

  - label: B_Other
    include_any:
      - "late pro-b cell"
    used_in_confusion: false

  - label: Mast_like
    include_any:
      - "naive b cell"

  - label: pDC_Myeloid_like
    include_any:
      - "precursor b cell"

  - label: Mature_B
    include_any:
      - "b cell"
      - "b-cell"
      - "b lymphocyte"
      - "follicular"
      - "mature b"

default_label: B_Other
